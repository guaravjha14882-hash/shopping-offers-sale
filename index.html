<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Mart | Fashion & Lifestyle</title>
<style>
:root{--pink:#f43397;--dark:#262626;--muted:#777;--bg:#f7f7f7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--dark)}
header{background:white;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}
.top{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:18px}
.logo{font-size:25px;font-weight:800;color:var(--pink);white-space:nowrap}
.search{flex:1;display:flex;border:1px solid #ddd;border-radius:8px;overflow:hidden}
.search input{border:0;padding:12px;width:100%;outline:none;font-size:15px}.search button{border:0;background:var(--pink);color:white;padding:0 18px}
.nav{max-width:1200px;margin:auto;display:flex;gap:10px;overflow:auto;padding:10px 16px;border-top:1px solid #eee}
.nav button{background:white;border:1px solid #eee;border-radius:20px;padding:9px 14px;white-space:nowrap;cursor:pointer}
.nav button.active{background:#ffe5f3;border-color:var(--pink);color:var(--pink)}
main{max-width:1200px;margin:18px auto;padding:0 16px}
.hero{border-radius:14px;overflow:hidden;min-height:200px;background:linear-gradient(115deg,#f43397,#ff8a5c);color:white;display:flex;align-items:center;justify-content:space-between;padding:30px 7%;margin-bottom:18px}
.hero h1{font-size:clamp(28px,5vw,48px);margin:0 0 10px}.hero p{font-size:18px;margin:0 0 15px}.hero .sale{font-size:clamp(45px,8vw,80px);font-weight:900;line-height:1}
.hero button,.btn{background:#fff;color:#e42c89;border:0;border-radius:8px;padding:12px 20px;font-weight:bold;cursor:pointer}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}.sectionhead h2{font-size:22px;margin:0}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin-bottom:24px}
.cat{border:1px solid #eee;background:white;border-radius:12px;padding:12px 7px;text-align:center;cursor:pointer}.cat .emoji{font-size:29px;display:block;margin-bottom:7px}.cat span:last-child{font-size:12px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border:1px solid #eee;border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 5px 15px #0001}
.card img{width:100%;height:210px;object-fit:cover;display:block;background:#eee}.info{padding:12px}.name{font-size:14px;margin:0 0 7px}.brand{font-size:12px;color:var(--muted);margin-bottom:8px}.price{font-weight:bold;font-size:16px}.old{color:#999;text-decoration:line-through;font-weight:normal;font-size:12px;margin-left:5px}.discount{color:#16834a;font-size:12px;margin-left:5px}.order{display:block;background:var(--pink);color:white;border:0;border-radius:7px;padding:10px;width:100%;margin-top:10px;font-weight:bold;cursor:pointer}
.detail{display:none;background:white;border-radius:14px;padding:16px;margin-bottom:20px}.detail.show{display:block}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.detail img{width:100%;max-height:520px;object-fit:contain;background:#fafafa;border-radius:12px}.detail h2{margin-top:0}.ad{background:#fff3f9;border:1px dashed #f43397;border-radius:10px;padding:15px;margin:16px 0}.continue{background:#262626;color:white;border:0;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer}.back{border:1px solid #ddd;background:white;border-radius:8px;padding:9px 14px;cursor:pointer;margin-bottom:12px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}.card img{height:260px}.detailgrid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.top{gap:10px}.logo{font-size:20px}.hero{padding:24px 6%}.hero p{font-size:14px}.detailgrid{grid-template-columns:1fr}.detail img{max-height:360px}}
</style>
</head>
<body>
<header>
 <div class="top"><div class="logo">Style Mart</div><div class="search"><input id="search" placeholder="Search T-shirt, shoes, saree..."><button onclick="searchProducts()">Search</button></div></div>
 <nav class="nav" id="nav"></nav>
</header>
<main>
 <section class="hero"><div><h1>MEGA FASHION SALE</h1><p>Trending styles • Great prices • Shop now</p><button onclick="showAll()">SHOP BEST SELLERS</button></div><div class="sale">SALE<br><span style="font-size:.48em">UP TO 60% OFF*</span></div></section>
 <section id="detail" class="detail"></section>
 <div class="sectionhead"><h2 id="heading">Shop by Category</h2></div>
 <section id="categories" class="categories"></section>
 <div class="sectionhead"><h2 id="productsTitle">Best Sale Products</h2><span style="color:#777;font-size:12px">Deals picked for you</span></div>
 <section id="products" class="products"></section>
</main>
<script>
const generalForm='https://surveyheart.com/form/6add7b0ffacbb0045b09cba';
const babyForm='https://surveyheart.com/form/6ada4fb9cc50420ac1f9304a';
const categories=[
 ['All','✨'],['T-shirt','👕'],['Lower','🩳'],['Men Shoes','👟'],['Watch','⌚'],['Perfume','🧴'],['Cap','🧢'],
 ['Women Saree','🥻'],['Girl Kurti','👗'],['Lehenga','💃'],['Girl Sandal','👡'],['Girl Shoes','👠'],['Frock','🎀'],['Baby Clothing','🍼']
];
const ranges={
 'Baby Clothing':[200,349],'T-shirt':[400,600],'Watch':[500,1200],'Frock':[400,700],'Perfume':[500,1200],
 'Cap':[100,300],'Girl Kurti':[500,1200],'Lehenga':[600,3000],'Women Saree':[600,1400],
 'Girl Sandal':[400,800],'Men Shoes':[400,1200],'Girl Shoes':[600,1400],'Lower':[350,800]
};
const photos={
 'Baby Clothing':'https://images.unsplash.com/photo-1519238263530-99 revolutions'.replace('99 revolutions','99revolutions'),
 'T-shirt':'https://images.unsplash.com/photo-152 garment-?auto=format&fit=crop&w=700&q=80',
 'Lower':'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=700&q=80',
 'Men Shoes':'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80',
 'Watch':'https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=700&q=80',
 'Perfume':'https://images.unsplash.com/photo- perfume?auto=format&fit=crop&w=700&q=80',
 'Cap':'https://images.unsplash.com/photo-帽子?auto=format&fit=crop&w=700&q=80',
 'Women Saree':'https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=700&q=80',
 'Girl Kurti':'https://images.unsplash.com/photo-1583391733956-6c78276477e4?auto=format&fit=crop&w=700&q=80',
 'Lehenga':'https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=700&q=80',
 'Girl Sandal':'https://images.unsplash.com/photo- sandal?auto=format&fit=crop&w=700&q=80',
 'Girl Shoes':'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=700&q=80',
 'Frock':'https://images.unsplash.com/photo-1519238263530-99revolutions?auto=format&fit=crop&w=700&q=80'
};
// Robust fallback image set; category-specific image URLs can be replaced with your own product photos.
const fallback='https://images.unsplash.com/photo-144 clothing?auto=format&fit=crop&w=700&q=80';
const items=[];
Object.keys(ranges).forEach((cat,ci)=>{for(let i=1;i<=4;i++){let [min,max]=ranges[cat];let price=Math.round((min+(max-min)*((i+ci)%4)/3)/10)*10;let off=[20,30,40,50][(i+ci)%4];items.push({id:cat+'-'+i,cat,name:['Trending '+cat,'Premium '+cat,'Everyday '+cat,'Latest '+cat][i-1],brand:['Style Mart','Fashion Hub','Urban Trend','New Look'][i-1],price,old:Math.round(price/(1-off/100)),off,img:photos[cat]||fallback});}});
let selected='All';
function renderNav(){document.getElementById('nav').innerHTML=categories.map(([c,e])=>`<button class="${selected===c?'active':''}" onclick="choose('${c}')">${e} ${c}</button>`).join('')}
function renderCats(){document.getElementById('categories').innerHTML=categories.filter(x=>x[0]!=='All').map(([c,e])=>`<div class="cat" onclick="choose('${c}')"><span class="emoji">${e}</span><span>${c}</span></div>`).join('')}
function card(p){return `<article class="card" onclick="openProduct('${p.id}')"><img src="${p.img}" onerror="this.src='https://placehold.co/600x700?text=${encodeURIComponent(p.cat)}'" alt="${p.name}"><div class="info"><p class="name">${p.name}</p><div class="brand">${p.brand}</div><div class="price">₹${p.price}<span class="old">₹${p.old}</span><span class="discount">${p.off}% off</span></div><button class="order" onclick="event.stopPropagation();openProduct('${p.id}')">Order Now</button></div></article>`}
function renderProducts(list=items){document.getElementById('products').innerHTML=list.map(card).join('');document.getElementById('productsTitle').textContent=selected==='All'?'Best Sale Products':selected+' Collection'}
function choose(cat){selected=cat;renderNav();document.getElementById('heading').textContent=cat==='All'?'Shop by Category':cat+' Collection';renderProducts(cat==='All'?items:items.filter(p=>p.cat===cat));document.getElementById('detail').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}
function openProduct(id){let p=items.find(x=>x.id===id);let form=p.cat==='Baby Clothing'?babyForm:generalForm;let d=document.getElementById('detail');d.innerHTML=`<button class="back" onclick="closeDetail()">← Back to products</button><div class="detailgrid"><img src="${p.img}" onerror="this.src='https://placehold.co/700x800?text=${encodeURIComponent(p.cat)}'"><div><h2>${p.name}</h2><div class="brand">Brand: ${p.brand}</div><div class="price">₹${p.price} <span class="old">₹${p.old}</span><span class="discount">${p.off}% OFF</span></div><p>Category: ${p.cat}</p><p>Latest style, comfortable fit and great value.</p><div class="ad"><b>Best Sale Offer!</b><p>Limited-time deals on trending fashion. Browse more products below.</p><button class="continue" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Continue Shopping</button></div><button class="order" onclick="window.open('${form}','_blank')">Order Now</button></div></div>`;d.classList.add('show');d.scrollIntoView({behavior:'smooth'});}
function closeDetail(){document.getElementById('detail').classList.remove('show')}
function searchProducts(){let q=document.getElementById('search').value.toLowerCase();renderProducts(items.filter(p=>(p.name+' '+p.cat+' '+p.brand).toLowerCase().includes(q)));document.getElementById('productsTitle').textContent='Search Results'}
function showAll(){choose('All');document.getElementById('products').scrollIntoView({behavior:'smooth'})}
renderNav();renderCats();renderProducts();
</script>
</body></html>
